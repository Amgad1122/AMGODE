    <!-- Suppress Cross-Origin Script Errors (e.g. from blocked/delayed ad scripts) -->
    <script>
      (function() {
        var isThirdPartyOrAdError = function(message, source) {
          var msg = (message || "").toLowerCase();
          var src = (source || "").toLowerCase();
          
          // Silence any "Script error." or empty error messages (typical of cross-origin/ad failures)
          if (msg.indexOf('script error') !== -1 || msg === 'script error' || !msg || msg === 'undefined') {
            // Do not silence our own application code errors if they have local sources
            var isLocalSource = src.indexOf('main.tsx') !== -1 || 
                                src.indexOf('app.tsx') !== -1 || 
                                src.indexOf('localhost') !== -1 || 
                                src.indexOf('run.app') !== -1 ||
                                src.indexOf('src/') !== -1;
            if (isLocalSource) {
              return false;
            }
            return true;
          }
          
          if (src.indexOf('effectivecpmnetwork') !== -1 || 
              src.indexOf('highperformanceformat') !== -1 || 
              src.indexOf('adsterra') !== -1) {
            return true;
          }
          
          return false;
        };

        // 1. Intercept setting window.onerror so we can filter errors before they reach parent wrappers
        var userOnError = null;
        Object.defineProperty(window, 'onerror', {
          get: function() {
            return userOnError;
          },
          set: function(fn) {
            if (typeof fn === 'function') {
              userOnError = function(message, source, lineno, colno, error) {
                if (isThirdPartyOrAdError(message, source)) {
                  console.warn('Silenced cross-origin error in dynamically assigned window.onerror:', message, 'at', source);
                  return true; // prevent default
                }
                return fn.apply(this, arguments);
              };
            } else {
              userOnError = fn;
            }
          },
          configurable: true,
          enumerable: true
        });

        // 2. Intercept window.addEventListener to wrap any registered 'error' or 'unhandledrejection' listeners
        var originalAddEventListener = window.addEventListener;
        window.addEventListener = function(type, listener, options) {
          if (type === 'error' || type === 'unhandledrejection') {
            var wrappedListener = function(e) {
              var msg = e.message || (e.reason && e.reason.message) || '';
              var src = e.filename || (e.reason && e.reason.stack) || '';
              if (isThirdPartyOrAdError(msg, src)) {
                console.warn('Intercepted and silenced cross-origin error in event listener:', msg);
                e.stopImmediatePropagation();
                e.preventDefault();
                return;
              }
              if (typeof listener === 'function') {
                return listener.call(this, e);
              } else if (listener && typeof listener.handleEvent === 'function') {
                return listener.handleEvent(e);
              }
            };
            return originalAddEventListener.call(window, type, wrappedListener, options);
          }
          return originalAddEventListener.apply(window, arguments);
        };

        // 3. Early direct event listeners to catch events before propagation
        originalAddEventListener.call(window, 'error', function(e) {
          var target = e.target;
          if (target && (target.tagName === 'SCRIPT' || target.tagName === 'IFRAME')) {
            var src = target.src || target.href || '';
            if (src.indexOf('effectivecpmnetwork') !== -1 || src.indexOf('highperformanceformat') !== -1) {
              console.warn('Silenced resource load failure for ad element:', src);
              e.stopImmediatePropagation();
              e.preventDefault();
              return;
            }
          }
          
          if (isThirdPartyOrAdError(e.message, e.filename)) {
            console.warn('Silenced global error event:', e.message, 'at', e.filename);
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);

        originalAddEventListener.call(window, 'unhandledrejection', function(e) {
          var reason = e.reason;
          var msg = reason ? (reason.message || '') : '';
          var stack = reason ? (reason.stack || '') : '';
          if (isThirdPartyOrAdError(msg, stack)) {
            console.warn('Silenced global unhandledrejection:', msg);
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
